name: flutter_boilerplate
description: "Flutter Android Boilerplate — offline-first, Riverpod + Drift, localization-ready."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local DB (Drift / SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Preferences
  shared_preferences: ^2.2.3

  # i18n
  intl: ^0.20.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true   # Required for flutter gen-l10n (ARB → Dart)

  assets:
    - assets/fonts/
    - assets/illustrations/
    - assets/icons/

  # Remove or replace these font families with your own.
  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/AppFont-Regular.ttf
          weight: 400
        - asset: assets/fonts/AppFont-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AppFont-Bold.ttf
          weight: 700
